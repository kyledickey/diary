name: diary

services:
    infra:
        build:
            context: .
            dockerfile: infra/Dockerfile
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-diary}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_USER: ${POSTGRES_USER:-diary}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        depends_on:
            infra:
                condition: service_healthy
        environment:
            API_URL: ${API_URL:-http://localhost:8080}
            AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Diary <auth@mail.kyle.so>}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
            DB_URL: postgresql://${POSTGRES_USER:-diary}:${POSTGRES_PASSWORD}@infra:5432/${POSTGRES_DB:-diary}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
            NODE_ENV: production
            PORT: 8080
            RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
            STRIPE_PLUS_PRICE_ID: ${STRIPE_PLUS_PRICE_ID:?Set STRIPE_PLUS_PRICE_ID in .env}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in .env}
            STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
            WEB_URL: ${WEB_URL:-http://localhost:3000}
        init: true
        ports:
            - "${API_PORT:-8080}:8080"
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        depends_on:
            api:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 3000
        init: true
        ports:
            - "${WEB_PORT:-3000}:3000"
        restart: unless-stopped

volumes:
    postgres-data:
